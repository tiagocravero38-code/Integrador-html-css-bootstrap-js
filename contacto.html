<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto · Mi Sitio</title>
  <!-- CSS de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">

        <a class="navbar-brand" href="index.html">Mi Sitio</a>

        <!-- icono hamburguesa: aparece por debajo de 992px -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <main class="container my-5">
  <section>
    <h1 class="h3 mb-1">Contacto</h1>
    <p class="text-secondary">Completá el formulario y te respondemos a la brevedad.</p>

    <form id="form-contacto" class="row g-3"
          action="https://labsys.frc.utn.edu.ar/dds-express/eco" method="POST">

      <div class="col-12 col-md-6">
        <label for="nombre" class="form-label">Nombre completo *</label>
        <input type="text" class="form-control" id="nombre" name="nombre"
               placeholder="Juan García" required>
      </div>

      <div class="col-12 col-md-6">
        <label for="email" class="form-label">Correo electrónico *</label>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="juan@email.com" required>
      </div>

      <div class="col-12 col-md-6">
        <label for="motivo" class="form-label">Motivo *</label>
        <select class="form-select" id="motivo" name="motivo" required>
          <option value="">— Elegí un motivo —</option>
          <option value="consulta">Consulta general</option>
          <option value="presupuesto">Solicitud de presupuesto</option>
          <option value="soporte">Soporte técnico</option>
        </select>
      </div>

      <div class="col-12 col-md-6">
        <label for="fecha" class="form-label">Fecha de contacto</label>
        <input type="date" class="form-control" id="fecha" name="fecha">
      </div>

      <div class="col-12">
        <label for="mensaje" class="form-label">Mensaje *</label>
        <textarea class="form-control" id="mensaje" name="mensaje" rows="5"
                  minlength="20" required></textarea>
        <div class="form-text"><span id="contador">0</span> caracteres (mínimo 20)</div>
      </div>

      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Enviar mensaje</button>
        <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
      </div>

    </form>

    <div id="aviso" class="alert alert-success mt-4 d-none"></div>

  </section>
</main>

  <footer class="bg-dark text-white-50 text-center py-4">
    <!-- Tu información real acá -->
    <small>Tiago Cravero · Legajo 402454 · 2026</small> 
  </footer>

  <!-- JS de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
